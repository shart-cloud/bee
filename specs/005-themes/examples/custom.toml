# bee config — a fully custom theme. All six semantic roles as RGB hex, plus a few extended colors
# for charts and sprites. No built-in `name` is needed; any unmatched name defines a new theme.
[theme]
name = "my-custom"
success = "#00ff00"
error   = "#ff0000"
info    = "#ffff00"
dim     = "#808080"
accent  = "#00ffff"
text    = "#ffffff"

[theme.extended]
highlight = "#ff00ff"
muted     = "#444444"
