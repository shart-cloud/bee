# Provider: Anthropic. The key is read from ANTHROPIC_API_KEY at startup and never written here or
# into the transcript. `model` is a CURRENT id passed verbatim to the client (H8).
[provider]
provider    = "anthropic"
model       = "claude-opus-4-8"   # or claude-sonnet-5, claude-haiku-4-5
api_key_env = "ANTHROPIC_API_KEY"
max_tokens  = 4096

# Extended thinking (opt-in). On Opus 4.8/4.7 (and Sonnet 5 / Fable 5) reasoning is OFF unless set
# here. "adaptive" lets the model decide when/how much to think; "disabled" is explicit off.
# thinking = "adaptive"
# Reasoning effort: low | medium | high | xhigh | max  (sent as output_config.effort).
# effort   = "high"

# Note: `temperature` is REJECTED by Opus 4.7/4.8, Sonnet 5, and Fable 5 (a 400). bee drops it with a
# warning for those models; it applies on Opus 4.6 / Sonnet 4.6 / Haiku and older.
# temperature = 0.7
