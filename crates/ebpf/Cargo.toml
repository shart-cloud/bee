[package]
name = "bee-ebpf"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
aya-ebpf = "0.2"
bee-common = { path = "../common" }

# `bee-lsm`, not `bee`: this is the BPF object embedded into `bee-userspace`, and naming it after
# the host command made the artifact copied out of this build indistinguishable by name from the
# executable people actually install (consolidation issue 08).
[[bin]]
name = "bee-lsm"
path = "src/main.rs"

[profile.dev]
opt-level = 3
debug = false
[profile.release]
lto = true
