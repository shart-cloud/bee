[workspace]
resolver = "2"
members = [
    "bee-common",
    "bee-core",
    "bee-hardening",
    "bee-userspace",
    "bee-cli",
    "bee-harness",
]
# bee-ebpf targets bpfel-unknown-none (nightly + bpf-linker) and is built out-of-band
# by bee-userspace/build.rs via aya-build. Excluding it keeps host `cargo build`/`cargo test`
# from trying to compile the BPF object with the default target.
exclude = ["bee-ebpf"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Jared Gore"]
repository = "https://github.com/jaredgore/bee"
rust-version = "1.85"

[workspace.dependencies]
# Shared POD map layouts (no_std) live here; both user-space and eBPF depend on it.
bee-common = { path = "bee-common" }
bee-core = { path = "bee-core" }
bee-userspace = { path = "bee-userspace" }
bee-hardening = { path = "bee-hardening" }

# User-space eBPF stack (stable Rust).
aya = "0.14"
aya-build = "0.2"

# LLM provider abstraction (bee-harness only). Async; tokio-required.
rig-core = "0.40"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "io-util"] }
async-trait = "0.1"

# Serialization / policy.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Syscalls (cgroup, prctl, name_to_handle_at, fork/exec).
nix = { version = "0.29", features = ["fs", "process", "sched", "resource", "user", "mount"] }
libc = "0.2"

# CLI.
clap = { version = "4", features = ["derive"] }

# Errors / time.
thiserror = "2"
time = { version = "0.3", features = ["formatting"] }

# Dev/test.
proptest = "1"
criterion = "0.5"

[profile.release]
lto = true
codegen-units = 1
