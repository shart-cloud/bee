[workspace]
resolver = "2"
members = [
    "crates/common",
    "crates/core",
    "crates/userspace",
]
# crates/ebpf targets bpfel-unknown-none (nightly + bpf-linker) and is built out-of-band
# by crates/userspace/build.rs via aya-build. Excluding it keeps host `cargo build`/`cargo test`
# from trying to compile the BPF object with the default target.
#
# xtask is the developer-tool crate (`cargo xtask viz-snapshot`, see xtask/README.md). It is its own
# workspace with its own lockfile, so its clap/anyhow — and, under xtask/viz-web, the whole
# ratzilla + wasm32 tree — never enter the shipping crates' dependency graph. Excluding it is what
# keeps `cargo build`/`cargo test`/`cargo clippy --workspace --all-targets` byte-for-byte unaffected
# by its existence.
exclude = ["crates/ebpf", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Jared Gore"]
repository = "https://github.com/jaredgore/bee"
rust-version = "1.85"

[workspace.dependencies]
# Shared POD map layouts (no_std) live here; both user-space and eBPF depend on it.
bee-common = { path = "crates/common" }
bee-core = { path = "crates/core" }
bee-userspace = { path = "crates/userspace" }

# User-space eBPF stack (stable Rust).
aya = "0.14"
aya-build = "0.2"

# LLM provider abstraction (application package only). Async; tokio-required.
rig-core = "0.40"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "io-util"] }
async-trait = "0.1"

# Serialization / policy.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
# YAML — only for SKILL.md frontmatter (006-skills, application only). `serde_yaml` is archived; this
# is its maintained drop-in continuation with the identical serde API.
serde_yaml_ng = "0.10"

# Syscalls (cgroup, prctl, name_to_handle_at, fork/exec).
nix = { version = "0.29", features = ["fs", "process", "sched", "resource", "user", "mount"] }
libc = "0.2"

# CLI.
clap = { version = "4", features = ["derive"] }

# Errors / time.
thiserror = "2"
time = { version = "0.3", features = ["formatting"] }

# Dev/test.
proptest = "1"
criterion = "0.5"

[profile.release]
lto = true
codegen-units = 1

[package]
name = "bee"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Kernel-enforced, capability-scoped sandboxing for AI coding agents."

# The application package: the `bee` executable and the harness library it drives. They are one
# package because the library has exactly one consumer (ADR-0002, consolidation issue 08). The
# library is `src/lib.rs` and everything beside it; the application layer — commands, the
# configuration resolver, session construction — is `src/app/`, reached only from `src/main.rs`.
[[bin]]
name = "bee"
path = "src/main.rs"

[lib]
name = "bee"
path = "src/lib.rs"

[features]
default = []
# Real kernel enforcement. Pulls bee-userspace's eBPF-LSM path (nightly bpf toolchain + BPF-LSM
# kernel to build/attach). WITHOUT this feature the harness runs tools as hardened, credential-
# stripped host processes with NO scope — enough for offline (MockModel) tests and live-provider
# smoke, and keeping the default workspace build runtime-/bpf-toolchain-free (Constitution V, SC-005).
enforce = ["bee-userspace/enforce"]
# Concurrent batch episodes: the async audit demux + shared-engine runner.
# Concurrent episodes (US4): the async audit demux + shared-engine runner. Pulls bee-userspace's
# `tokio` feature (which implies `enforce`) and turns on the harness `enforce` path it builds on.
# Kept separate from `enforce` so the plain enforce build stays async-runtime-free (SC-005).
concurrent = ["enforce", "bee-userspace/tokio"]
# MCP client (004-mcp-client). Default-off so the plain build stays rmcp-free (NFR-004/006, SC-026/027):
# no MCP code compiles and `rmcp` never enters bee-core/bee-common's tree unless this is enabled. Gates
# the optional `rmcp` dep below. Stdio (`transport-child-process`) ships first; the remote
# Streamable-HTTP transport feature is added with the domain-gating slice (US9, task T024).
mcp = ["dep:rmcp"]
# Full-screen TUI front-end (008-grid-tui, M3–M4). Default-off so the plain build stays headless and
# free of a terminal backend (Constitution V / SC-005): turns on ratatui's crossterm backend and pulls
# the optional terminal deps below. Without it, `viz::buffer_render` keeps using the headless Buffer
# and `bee-repl` runs the inline REPL only. 009 adds tachyonfx here too, so the effects pipeline is
# compiled only in full-screen builds.
tui = [
    "dep:crossterm",
    "dep:color-eyre",
    "dep:textwrap",
    "dep:tachyonfx",
    "dep:tui-markdown",
    "ratatui/crossterm",
    "tokio/sync",
]

[dependencies]
bee-core = { workspace = true }
bee-userspace = { workspace = true }

rig-core = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
async-stream = "0.3"
futures-util = "0.3"
clap = { workspace = true }

# ripgrep as a pure-Rust library (wraps ripgrep's own `grep`/`ignore` core crates — no external `rg`
# binary). Used ONLY by the hidden `bee search-worker` subcommand, which the model-facing `search`
# tool execs through the sandbox: running the library in that worker — rather than in the harness —
# is what keeps every file it opens under the eBPF scope's `file_open` policy. `bstr` reads the
# `Match::text` (arbitrary bytes) the worker prints. NOT optional: `search` is a default tool, so the
# worker must exist in every build.
ripgrep-api = "0.2"
bstr = "1"
# Pinned to 17: rustyline 18 added a `unicode-width =0.2.2` dependency that conflicted with ratatui
# 0.29's `unicode-width =0.2.0` pin. ratatui-core 0.1 relaxed that to `>=0.2.0`, so the conflict is
# gone and 18 would now resolve — but unpinning is deliberately out of scope for 009 (research R1).
# rustyline 17 has the same DefaultEditor/ExternalPrinter API this crate uses (003-visual-render).
rustyline = "17"

# Visual rendering (003-visual-render, application package only — MUST NOT propagate to bee-core/bee-common,
# NFR-002/SC-019). `rhai` sync => Engine is Send+Sync so RenderTool can own it; only_i64 trims size;
# NO `unchecked` (that would disable the resource limits, FR-020). `ratatui` with no default features
# gives headless Buffer/widgets/layout without crossterm or any terminal backend (research D2/D3).
rhai = { version = "1", default-features = false, features = ["only_i64", "sync"] }
ratatui = { version = "0.30", default-features = false }

# Full-screen TUI backend (008-grid-tui). All optional + gated by the `tui` feature above so the
# default build stays headless (research D1/D10). crossterm 0.29 matches what ratatui 0.30's backend
# links: `ratatui-crossterm` defaults to `crossterm_0_29` and its cfg_if always prefers the newest
# enabled version, so `ratatui/crossterm_0_28` cannot hold the version — it only adds a *second*
# crossterm, leaving two instances driving the same tty (009 research R2/D1). Matching at 0.29 keeps
# exactly one. `event-stream` gives the async input stream. color-eyre installs the panic hook that
# restores the terminal; textwrap wraps chat to the pane width.
crossterm = { version = "0.29", features = ["event-stream"], optional = true }
color-eyre = { version = "0.6", optional = true }
textwrap = { version = "0.16", optional = true }

# Terminal effects (009-tachyonfx-effects, application package only — MUST NOT propagate to
# bee-core/bee-common, SC-009). Optional + `tui`-gated so the headless build never compiles it.
# `default-features = false` drops the `dsl` parser (and its `anpa` dep): bee builds effects from
# `EffectSpec` data in Rust, never from tachyonfx's DSL strings. `std` is re-enabled explicitly — it
# is the other half of tachyonfx's default and carries the std interop the harness needs. No I/O, no
# FFI, no `rand` — tachyonfx carries its own seeded `SimpleRng`, which is what makes the effect
# snapshots deterministic rather than flaky.
tachyonfx = { version = "0.25", default-features = false, features = [
    "std",
], optional = true }

# MCP client SDK (004-mcp-client, application package only — MUST NOT propagate to bee-core/bee-common,
# NFR-004/SC-026). Optional + gated by the `mcp` feature above. rmcp is v2.x (the spec's "1" is a
# stale major with a different API; research R1). `default-features = false` because rmcp's defaults
# enable the SERVER, not the client — we add `client` explicitly. `transport-child-process` is the
# sandboxed stdio transport (research R3); `transport-streamable-http-client-reqwest` is the
# domain-gated remote transport (US9 — rmcp 2.x removed the SSE client, so `transport = "sse"` is a
# deprecated alias routed here, research R2).
rmcp = { version = "2.2", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest"], optional = true }

# Markdown → ratatui `Text` (010, application package only — MUST NOT propagate to bee-core/bee-common).
# Optional + `tui`-gated, like every other terminal dep. NOT the `ratatui-markdown` crate: that one
# still pins `ratatui ^0.29`, which cannot unify with the 0.30 the TUI is built on, so cargo would
# resolve a *second* ratatui whose `Text`/`Buffer` are different types — widgets from one cannot
# render into the other's buffer. `tui-markdown` 0.3.8 moved to `ratatui-core ^0.1`, which is exactly
# what ratatui 0.30 is built on, so there is one ratatui in the tree. `default-features = false`
# drops `highlight-code` (and its `syntect` + `ansi-to-tui` deps): bee colors code blocks from the
# active theme's roles (005-themes), not from a second, theme-blind highlighter.
tui-markdown = { version = "0.3.8", default-features = false, optional = true }

serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
# SKILL.md frontmatter parsing (006-skills). Harness-only — MUST NOT propagate to bee-core/bee-common.
serde_yaml_ng = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
libc = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "process", "time"] }
tempfile = "3"
proptest = { workspace = true }
# Pinned frame snapshots for the TUI (008-grid-tui, research D12).
insta = "1"
