[package]
name = "bee-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "The bee application and its sole host executable (ADR-0002)."

[[bin]]
name = "bee"
path = "src/main.rs"

[dependencies]
bee-core = { workspace = true }
bee-userspace = { path = "../bee-userspace" }
clap = { workspace = true }

[features]
default = []
enforce = ["bee-userspace/enforce"]
