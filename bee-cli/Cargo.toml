[package]
name = "bee-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "The bee application and its sole host executable (ADR-0002)."

[[bin]]
name = "bee"
path = "src/main.rs"

[dependencies]
bee-core = { workspace = true }
bee-userspace = { path = "../bee-userspace" }
# The harness library: the sessions `bee run` / `bee repl` drive, and the home of the provider,
# theme, and visual types the configuration resolver resolves *into*. The application package is
# allowed this dependency; `bee-core` and `bee-common` are not, and `core_deps_guard` enforces that.
bee-harness = { path = "../bee-harness" }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
# The session commands are async; `check`, `validate`, and `exec` are not. The runtime is built
# inside `run`/`repl` rather than with `#[tokio::main]` so the diagnostic commands never enter one.
tokio = { workspace = true }
# `TIOCGWINSZ` for the terminal row count the full-screen hard-floor check needs. Only reached
# under the `tui` feature, but a plain dep: an optional one for three lines of ioctl is noise.
libc = { workspace = true }

[dev-dependencies]
tempfile = "3"

[features]
default = []
# Each feature forwards to the harness feature of the same name: they gate whole code paths (kernel
# enforcement, the async audit demux, the MCP client, the terminal backend), so the application
# cannot expose a journey the harness was not built with.
enforce = ["bee-userspace/enforce", "bee-harness/enforce"]
concurrent = ["enforce", "bee-harness/concurrent"]
mcp = ["bee-harness/mcp"]
tui = ["bee-harness/tui"]
